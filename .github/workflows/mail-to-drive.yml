name: Выгрузка уведомлений BIDV

on:
  schedule:
    # Каждый час в начале часа; GitHub может запускать задачу с задержкой.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-to-drive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код и журнал обработанных писем
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Прочитать почту и сохранить JSON
        env:
          YANDEX_EMAIL: ${{ secrets.YANDEX_EMAIL }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          YANDEX_MAIL_FOLDER: ${{ vars.YANDEX_MAIL_FOLDER }}
          STATE_FILE: processed_uids.json
          TRANSACTIONS_DIR: transactions
        run: python main.py

      - name: Сохранить изменения в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_uids.json transactions/
          if git diff --staged --quiet; then
            echo "Нет новых транзакций"
            exit 0
          fi
          git commit -m "chore: добавить новые транзакции BIDV"
          git push

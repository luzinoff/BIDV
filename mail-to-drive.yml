name: Выгрузка уведомлений BIDV

on:
  schedule:
    # Каждый час в начале часа; GitHub может запускать задачу с задержкой.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-to-drive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код и журнал обработанных писем
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прочитать почту и выгрузить JSON
        env:
          YANDEX_EMAIL: ${{ secrets.YANDEX_EMAIL }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_MAIL_FOLDER: ${{ vars.YANDEX_MAIL_FOLDER }}
          STATE_FILE: processed_uids.json
        run: python main.py

      - name: Сохранить журнал обработанных писем
        run: |
          if git diff --quiet -- processed_uids.json; then
            echo "Журнал не изменился"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_uids.json
          git commit -m "chore: обновить журнал почтовых уведомлений"
          git push
